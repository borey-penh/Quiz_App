<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
</head>
<body>
    {% extends 'base.html' %}

    {% block content %}
    <div class="manage-questions">
        <h1>Manage Questions for {{ quiz.title }}</h1>
        
        <!-- Add Question Form -->
        <div class="add-question">
            <h2>Add New Question</h2>
            <form method="POST" action="{{ url_for('add_question', quiz_id=quiz.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="form-group">
                    <label for="question_text">Question:</label>
                    <input type="text" id="question_text" name="text" required>
                </div>
                
                <div class="choices">
                    <label>Choices:</label>
                    {% for i in range(4) %}
                    <div class="choice-input">
                        <input type="text" name="choice{{ i }}" required>
                        <input type="radio" name="correct" value="{{ i }}" required>
                        <label>Correct?</label>
                    </div>
                    {% endfor %}
                </div>
                
                <button type="submit">Add Question</button>
            </form>
        </div>

        <!-- Existing Questions -->
        <div class="existing-questions">
            <h2>Existing Questions</h2>
            {% for question in questions %}
            <div class="question-item">
                <!-- Edit Form -->
                <form method="POST" action="{{ url_for('edit_question', question_id=question.id) }}" class="edit-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="form-group">
                        <input type="text" name="text" value="{{ question.text }}" required>
                    </div>
                    
                    <div class="choices">
                        {% for i in range(4) %}
                        <div class="choice-input">
                            <input type="text" name="choice{{ i }}" value="{{ question.choices()[i] }}" required>
                            <input type="radio" name="correct" value="{{ i }}" 
                                {% if i == question.correct %}checked{% endif %}>
                            <label>Correct?</label>
                        </div>
                        {% endfor %}
                    </div>
                    
                    <div class="question-actions">
                        <button type="submit">Update</button>
                        <!-- Delete Form - Separate from Edit Form -->
                        <form method="POST" action="{{ url_for('delete_question', question_id=question.id) }}" style="display:inline;">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <button type="submit" class="btn-delete" onclick="return confirm('Are you sure you want to delete this question?')">Delete</button>
                        </form>
                    </div>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endblock %}
</body>
</html>
